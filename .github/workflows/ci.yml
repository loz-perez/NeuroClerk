name: Calidad

on:
  push:
    branches: [feature/entorno-wsl, main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de prueba
        run: python -m pip install -r requirements-test.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest -q
