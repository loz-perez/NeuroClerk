[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", ".venv-ragas", "datos", "chroma_db", "evaluaciones", "pruebas", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
# B905: los zip del proyecto emparejan listas de la misma longitud; exigir strict= no aporta.
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["rag", "soap", "banco", "panel", "probar_rag", "probar_soap", "evaluar_ragas"]

[tool.ruff.lint.per-file-ignores]
# probar_rag.py fija NEUROCLERK_MODELO antes de importar rag a propósito.
"probar_rag.py" = ["E402"]
